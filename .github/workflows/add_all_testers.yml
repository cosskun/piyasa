name: Add All Testers to TestFlight
on: workflow_dispatch

jobs:
  add_all:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add Rumeysa to External Group
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e "
          const jwt = require('jsonwebtoken');
          const keyId = process.env.KEY_ID;
          const issuerId = process.env.ISSUER_ID;
          const privateKey = process.env.PRIVATE_KEY;

          function getAscToken() {
            const now = Math.floor(Date.now() / 1000);
            return jwt.sign({
              iss: issuerId,
              iat: now,
              exp: now + 1200,
              aud: 'appstoreconnect-v1'
            }, privateKey, {
              algorithm: 'ES256',
              header: { kid: keyId, typ: 'JWT' }
            });
          }

          async function main() {
            const token = getAscToken();
            const appId = '6823125505';
            const headers = {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            };

            // 1. Check all users in Users and Access
            const uRes = await fetch('https://api.appstoreconnect.apple.com/v1/users', { headers });
            const uData = await uRes.json();
            console.log('Users in account:', (uData.data || []).map(u => u.attributes.username || u.attributes.email));

            // 2. Create an External Beta Group for Piyasa
            console.log('Checking/Creating External Beta Group...');
            const bgRes = await fetch('https://api.appstoreconnect.apple.com/v1/apps/' + appId + '/betaGroups', { headers });
            const bgData = await bgRes.json();
            let extGroupId = null;
            for (const g of (bgData.data || [])) {
              if (g.attributes.name === 'Dis Ekip' || !g.attributes.isInternalGroup) {
                extGroupId = g.id;
                break;
              }
            }

            if (!extGroupId) {
              const cRes = await fetch('https://api.appstoreconnect.apple.com/v1/betaGroups', {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  data: {
                    type: 'betaGroups',
                    attributes: { name: 'Dis Ekip', isInternalGroup: false, hasAccessToAllBuilds: true },
                    relationships: { app: { data: { type: 'apps', id: appId } } }
                  }
                })
              });
              const cData = await cRes.json();
              if (cRes.ok) {
                extGroupId = cData.data.id;
                console.log('Created External Group Dis Ekip:', extGroupId);
              } else {
                console.log('External group create status:', cRes.status, JSON.stringify(cData));
              }
            } else {
              console.log('Found External Group:', extGroupId);
            }

            // 3. Add external testers
            if (extGroupId) {
              const extraEmails = ['rumeysa1166metin@gmail.com', 'mtn.rumeysa@gmail.com'];
              for (const email of extraEmails) {
                console.log('Adding to external group:', email);
                const addRes = await fetch('https://api.appstoreconnect.apple.com/v1/betaTesters', {
                  method: 'POST',
                  headers,
                  body: JSON.stringify({
                    data: {
                      type: 'betaTesters',
                      attributes: { email: email, firstName: 'Rumeysa', lastName: 'Metin' },
                      relationships: {
                        betaGroups: { data: [{ type: 'betaGroups', id: extGroupId }] }
                      }
                    }
                  })
                });
                console.log('Add ' + email + ' status:', addRes.status);
                if (addRes.ok) {
                  console.log('✔ Added ' + email + ' to External Group!');
                } else {
                  console.log('Response:', await addRes.text());
                }
              }
            }
          }

          main().catch(console.error);
          "
