name: Check ASC Status
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect ASC
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e "
          const jwt = require('jsonwebtoken');
          const keyId = process.env.KEY_ID;
          const issuerId = process.env.ISSUER_ID;
          const privateKey = process.env.PRIVATE_KEY;

          function getAscToken() {
            const now = Math.floor(Date.now() / 1000);
            return jwt.sign({
              iss: issuerId,
              iat: now,
              exp: now + 1200,
              aud: 'appstoreconnect-v1'
            }, privateKey, {
              algorithm: 'ES256',
              header: { kid: keyId, typ: 'JWT' }
            });
          }

          async function main() {
            const token = getAscToken();
            const appId = '6823125505';

            // 1. Get app info
            const appRes = await fetch('https://api.appstoreconnect.apple.com/v1/apps/' + appId, {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
            });
            const appData = await appRes.json();
            console.log('App in ASC:', appData.data ? appData.data.attributes.name : appData);

            // 2. Get builds
            const buildsRes = await fetch('https://api.appstoreconnect.apple.com/v1/builds?filter[app]=' + appId, {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
            });
            const buildsData = await buildsRes.json();
            console.log('Total builds:', (buildsData.data || []).length);
            for (const b of (buildsData.data || [])) {
              console.log('Build ID:', b.id, 'Version:', b.attributes.version, 'ProcessingState:', b.attributes.processingState, 'UsesNonExemptEncryption:', b.attributes.usesNonExemptEncryption);
            }

            // 3. Get beta groups for app
            const bgRes = await fetch('https://api.appstoreconnect.apple.com/v1/apps/' + appId + '/betaGroups', {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
            });
            const bgData = await bgRes.json();
            console.log('Beta Groups for Piyasa:', (bgData.data || []).map(g => g.attributes.name));

            // 4. Get beta testers for app
            const btRes = await fetch('https://api.appstoreconnect.apple.com/v1/apps/' + appId + '/betaTesters', {
              headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
            });
            const btData = await btRes.json();
            console.log('Beta Testers attached to Piyasa:', (btData.data || []).length);
            for (const t of (btData.data || [])) {
              console.log('  Tester:', t.attributes.email, t.attributes.firstName, t.attributes.lastName);
            }
          }

          main().catch(console.error);
          "
